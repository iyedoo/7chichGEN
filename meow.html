<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Grid</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      margin: 20px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(32, 12px);
      grid-template-rows: repeat(32, 12px);
      margin-bottom: 20px;
    }
    .cell {
      width: 12px;
      height: 12px;
      background: #fff;
    }
  </style>
</head>
<body>
  <h2>Pixel Grid Viewer</h2>
  
  <div class="controls">
    <label>Color 0 <input type="color" id="c0" value="#cc1111"></label>
    <label>Color 1 <input type="color" id="c1" value="#ee1111"></label>
    <label>Color 2 <input type="color" id="c2" value="#ff3333"></label>
    <label>Color 3 <input type="color" id="c3" value="#ff5555"></label>
    <label>Color 4 <input type="color" id="c4" value="#ff9999"></label>
  </div>
  
  <div id="grid" class="grid"></div>
  
  <div class="controls">
    <input type="text" id="filename" placeholder="Enter file name" value="pixel-art">
    <button id="download">Download</button>
  </div>
  
  <canvas id="canvas" width="32" height="32" style="display:none;"></canvas>

        [15,26,0],
        [14,27,0]
    ];
    
    const grid = document.getElementById('grid');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const cells = [];
    for (let i = 0; i < 32 * 32; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cells.push(cell);
      grid.appendChild(cell);
    }
    
    function render() {
      const colors = [
        document.getElementById('c0').value,
        document.getElementById('c1').value,
        document.getElementById('c2').value,
        document.getElementById('c3').value,
        document.getElementById('c4').value
      ];
      
      // Clear
      cells.forEach(cell => cell.style.background = '#fff');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, 32, 32);
      
      // Apply pixels
      for (const [x,y,c] of pixels) {
        const idx = y * 32 + x;
        cells[idx].style.background = colors[c];
        
        ctx.fillStyle = colors[c];
        ctx.fillRect(x, y, 1, 1); // 1 pixel per cell in canvas
      }
    }
    
    // Hook up color inputs
    for (let i = 0; i < 5; i++) {
      document.getElementById('c' + i).addEventListener('input', render);
    }
    
    document.getElementById('download').addEventListener('click', () => {
      const filename = document.getElementById('filename').value || 'pixel-art';
      const link = document.createElement('a');
      // Scale up the canvas for download (optional, e.g., ×16)
      const scale = 16;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 32 * scale;
      tempCanvas.height = 32 * scale;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.imageSmoothingEnabled = false;
      tempCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
      
      link.href = tempCanvas.toDataURL('image/png');
      link.download = filename + '.png';
      link.click();
    });
    
    render();
  </script>
</body>
</html>
