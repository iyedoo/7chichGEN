<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>7chichGEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <h2><span style="color: red;"">7chich</span>GEN</h2>
  
  <div class="controls">
    <label data-color="0">
      <span>Border</span>
      <div class="color-swatch" id="swatch-0" style="background: #cc1111;"></div>
    </label>
    <label data-color="1">
      <span>Dark</span>
      <div class="color-swatch" id="swatch-1" style="background: #ee1111;"></div>
    </label>
    <label data-color="2">
      <span>Normal</span>
      <div class="color-swatch" id="swatch-2" style="background: #ff3333;"></div>
    </label>
    <label data-color="3">
      <span>Light</span>
      <div class="color-swatch" id="swatch-3" style="background: #ff5555;"></div>
    </label>
    <label data-color="4">
      <span>Lighter</span>
      <div class="color-swatch" id="swatch-4" style="background: #ff9999;"></div>
    </label>
  </div>
  
  <div id="grid" class="grid"></div>
  
  <div class="download-controls">
    <input type="text" id="filename" placeholder="Enter file name" value="7chicha">
    <button id="download">Download PNG</button>
  </div>
  
  <div class="color-picker-overlay" id="colorPickerOverlay">
    <div class="color-picker-card">
      <button class="close-btn" id="closeColorPicker">&times;</button>
      
      <div class="color-picker-left">
        <div style="position:relative">
          <canvas id="sv" class="color-picker-canvas"></canvas>
          <div id="svThumb" class="thumb"></div>
        </div>
        <div style="position:relative">
          <canvas id="hue" class="color-picker-canvas"></canvas>
          <div id="hueLine" class="hue-line"></div>
        </div>
        <div class="color-preview" id="preview"></div>
      </div>
      
      <div class="color-picker-right">
        <div class="color-picker-input-group">
          <label>HEX</label>
          <input id="hex" value="#ff0000">
        </div>
        <div class="color-picker-input-group">
          <label>RGB</label>
          <input id="rgb" value="255,0,0">
        </div>
        <div class="color-picker-input-group">
          <label>HSV</label>
          <input id="hsv" value="0,100,100">
        </div>
        <div class="color-picker-buttons">
          <button class="color-picker-btn primary" id="applyColor">Apply</button>
          <button class="color-picker-btn secondary" id="cancelColor">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  
  <canvas id="canvas" width="32" height="32" style="display:none;"></canvas>
  
  <script src="script.js"></script>
</body>
</html>
